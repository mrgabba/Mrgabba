<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATC & Flight Deck Script Generator</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #131b2e;
      --bg-card: #1a243b;
      --bg-input: #0f1626;
      --border-color: #2b3a5c;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-purple: #a78bfa;
      --font-mono: 'Courier New', Courier, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding: 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-weight: bold;
      font-size: 1.1rem;
    }

    h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px; }
    .subtitle { font-size: 0.85rem; color: var(--text-muted); }

    .grid-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }

    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }

    .panel-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-blue);
      margin-bottom: 16px;
      font-weight: 700;
    }

    .form-group { margin-bottom: 14px; }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent-blue); }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-input);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; }
    .checkbox-item input[type="checkbox"] { width: auto; accent-color: var(--accent-blue); }

    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: var(--accent-blue); color: #0b0f19; }
    .btn-primary:hover { background: #7dd3fc; }
    .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { border-color: var(--accent-blue); }

    .flight-strip {
      background: var(--bg-card);
      border-left: 4px solid var(--accent-blue);
      padding: 12px 16px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
    }
    .strip-item span { color: var(--text-muted); display: block; font-size: 0.7rem; }

    #mapContainer {
      width: 100%;
      height: 320px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      display: block;
      z-index: 1;
    }

    .phase-block {
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-secondary);
    }
    .phase-header {
      background: var(--bg-card);
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--accent-blue);
    }
    .phase-time { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); background: var(--bg-input); padding: 2px 8px; border-radius: 4px; }

    .comm-list { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
    .comm-card { background: var(--bg-input); border-radius: 8px; padding: 12px 14px; border-left: 3px solid var(--accent-blue); }
    .comm-card.type-atc { border-left-color: var(--accent-blue); }
    .comm-card.type-pilot-atc { border-left-color: var(--accent-green); }
    .comm-card.type-crew { border-left-color: var(--accent-amber); background: rgba(245, 158, 11, 0.05); }
    .comm-card.type-pa { border-left-color: var(--accent-purple); background: rgba(167, 139, 250, 0.05); }

    .comm-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.78rem; }
    .badge { padding: 2px 7px; border-radius: 4px; font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }
    .badge-atc { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
    .badge-pilot { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
    .badge-crew { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); }
    .badge-pa { background: rgba(167, 139, 250, 0.2); color: var(--accent-purple); }

    .channel-tag { font-family: var(--font-mono); color: var(--text-muted); font-size: 0.75rem; }
    .text-en { font-family: var(--font-mono); font-size: 0.92rem; color: #f8fafc; margin-bottom: 6px; }
    .text-it { font-size: 0.86rem; color: var(--text-muted); font-style: italic; border-top: 1px dashed rgba(148, 163, 184, 0.2); padding-top: 6px; }

    .glossary-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; margin-top: 20px; }
    .glossary-box h3 { font-size: 0.9rem; color: var(--accent-amber); margin-bottom: 10px; text-transform: uppercase; }
    .glossary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; font-size: 0.82rem; }
    .glossary-item strong { color: var(--text-main); font-family: var(--font-mono); }
    .glossary-item span { color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <div class="brand-icon">VHF // PA</div>
      <div>
        <h1>Flight Deck & ATC Script Generator</h1>
        <div class="subtitle">Simulatore fraseologia con Readback Rigoroso e Mappa Dinamica</div>
      </div>
    </div>
  </header>

  <div class="grid-layout">
    <aside class="panel">
      <div class="panel-title">Parametri del Volo</div>

      <div class="row-2">
        <div class="form-group">
          <label for="airline">Compagnia Aerea</label>
          <select id="airline">
            <option value="AZ|ITY|ITA Airways">ITA Airways (AZ)</option>
            <option value="AA|AAL|American Airlines">American Airlines (AA)</option>
            <option value="LH|DLH|Lufthansa">Lufthansa (LH)</option>
            <option value="BA|BAW|British Airways">British Airways (BA)</option>
            <option value="AF|AFR|Air France">Air France (AF)</option>
            <option value="EK|UAE|Emirates">Emirates (EK)</option>
            <option value="FR|RYR|Ryanair">Ryanair (FR)</option>
            <option value="U2|EZY|easyJet">easyJet (U2)</option>
            <option value="DL|DAL|Delta Air Lines">Delta (DL)</option>
            <option value="UA|UAL|United Airlines">United (UA)</option>
            <option value="LX|SWR|SWISS">SWISS (LX)</option>
            <option value="QR|QTR|Qatar Airways">Qatar Airways (QR)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="flightNum">Numero Volo</label>
          <input type="text" id="flightNum" value="1658" />
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="captainName">Nome Comandante</label>
          <input type="text" id="captainName" value="Andrea Gabbanini" />
        </div>
        <div class="form-group">
          <label for="aircraft">Aeromobile</label>
          <input type="text" id="aircraft" value="Airbus A320neo" />
        </div>
      </div>

      <div class="form-group">
        <label for="origin">Aeroporto Partenza (es. LIRQ o Firenze)</label>
        <input type="text" id="origin" value="LIRQ - Firenze Peretola" />
      </div>

      <div class="form-group">
        <label for="destination">Aeroporto Arrivo (es. LIRF o Roma)</label>
        <input type="text" id="destination" value="LIRF - Roma Fiumicino" />
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="depTime">Orario Partenza</label>
          <input type="time" id="depTime" value="11:30" />
        </div>
        <div class="form-group">
          <label for="arrTime">Orario Arrivo Locale</label>
          <input type="time" id="arrTime" value="12:20" />
        </div>
      </div>

      <div class="form-group">
        <label for="weather">Meteo Arrivo</label>
        <select id="weather">
          <option value="CAVOK|Sereno, 24°C">Sereno / Brezza</option>
          <option value="CROSSWIND|Vento al traverso">Vento Forte</option>
          <option value="RAIN|Pioggia leggera, 16°C">Pioggia / Nuvoloso</option>
        </select>
      </div>

      <div class="form-group">
        <label>Canali e Fasi</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" id="chkATC" checked /><span>📻 Radio ATC (con Readback)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkCrew" checked /><span>🔔 Comandi Cabin Crew</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPA" checked /><span>🎙️ Annunci Passeggeri (PA)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkLangIt" checked /><span>🇮🇹 Mostra Traduzione Italiana</span></label>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="generateScript(false)">✈️ Genera Copione & Mappa</button>
        <button class="btn-secondary" onclick="generateScript(true)">🎲 Nuova Variante</button>
      </div>
    </aside>

    <main>
      <div class="flight-strip" id="flightStrip"></div>
      <div id="mapContainer"></div>
      <div id="scriptOutput"></div>
      <div class="glossary-box" id="glossaryBox"></div>
    </main>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  let currentVariantSeed = 0;
  let mapInstance = null;

  // Funzione asincrona che interroga Nominatim (OpenStreetMap) per trovare coordinate reali di qualsiasi città/aeroporto inserito
  async function getCoords(query) {
    // Pulisce la stringa rimuovendo codici ICAO iniziali se presenti (es. "LIRQ - Firenze" diventa "Firenze")
    const cleanQuery = query.replace(/^[A-Z]{4}\s*-\s*/, "").trim();
    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cleanQuery + " airport")}&limit=1`);
      const data = await response.json();
      if (data && data.length > 0) {
        return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), name: cleanQuery };
      }
      // Secondo tentativo senza la parola "airport" se non trova nulla
      const response2 = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cleanQuery)}&limit=1`);
      const data2 = await response2.json();
      if (data2 && data2.length > 0) {
        return { lat: parseFloat(data2[0].lat), lon: parseFloat(data2[0].lon), name: cleanQuery };
      }
    } catch (e) {
      console.error("Geocoding error:", e);
    }
    // Coordinate di fallback (Roma) se la rete o il servizio falliscono
    return { lat: 41.8, lon: 12.2, name: cleanQuery };
  }

  function addMinutes(timeStr, mins) {
    const [h, m] = timeStr.split(":").map(Number);
    const total = (h * 60 + m + mins + 1440) % 1440;
    return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
  }

  function formatQNH(code) {
    return code.startsWith("K") ? { en: `altimeter 29.92`, it: `altimetro 29.92 inHg` } : { en: `QNH 1013`, it: `QNH 1013 hPa` };
  }

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 3440.065;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return Math.round(R * c);
  }

  function updateMap(depLoc, arrLoc) {
    const depLatLng = [depLoc.lat, depLoc.lon];
    const arrLatLng = [arrLoc.lat, arrLoc.lon];

    if (!mapInstance) {
      mapInstance = L.map('mapContainer', { zoomControl: true }).setView(depLatLng, 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(mapInstance);
    } else {
      mapInstance.eachLayer((layer) => {
        if (!layer._url) mapInstance.removeLayer(layer);
      });
    }

    L.marker(depLatLng).addTo(mapInstance).bindPopup(`<b>Partenza:</b> ${depLoc.name}`);
    L.marker(arrLatLng).addTo(mapInstance).bindPopup(`<b>Arrivo:</b> ${arrLoc.name}`);

    const routeLine = L.polyline([depLatLng, arrLatLng], {
      color: '#0284c7',
      weight: 4,
      dashArray: '6, 6'
    }).addTo(mapInstance);

    mapInstance.invalidateSize();
    mapInstance.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
  }

  async function generateScript(randomize = false) {
    if (randomize) currentVariantSeed++;

    const airlineVal = document.getElementById("airline").value.split("|");
    const iataAirline = airlineVal[0], icaoAirline = airlineVal[1], airlineName = airlineVal[2];
    const radioCallsignMap = { "ITY": "ITArrow", "AAL": "American", "DLH": "Lufthansa", "BAW": "Speedbird", "AFR": "Airfrans" };
    
    const flightNum = document.getElementById("flightNum").value.trim() || "1658";
    const captainName = document.getElementById("captainName").value.trim() || "Andrea Gabbanini";
    const radioCallsign = `${radioCallsignMap[icaoAirline] || airlineName} ${flightNum}`;

    const originInput = document.getElementById("origin").value;
    const destInput = document.getElementById("destination").value;

    // Estrae eventuali codici ICAO scritti all'inizio (es. LIRQ)
    const depCodeMatch = originInput.match(/^([A-Z]{4})/);
    const arrCodeMatch = destInput.match(/^([A-Z]{4})/);
    const depCode = depCodeMatch ? depCodeMatch[1] : "DEP";
    const arrCode = arrCodeMatch ? arrCodeMatch[1] : "ARR";

    // Ricerca asincrona delle coordinate basata su ciò che l'utente ha scritto nei campi
    const depLoc = await getCoords(originInput);
    const arrLoc = await getCoords(destInput);

    const depTime = document.getElementById("depTime").value || "11:30";
    const arrTime = document.getElementById("arrTime").value || "12:20";

    const depRwy = currentVariantSeed % 2 === 0 ? "05" : "23";
    const arrRwy = currentVariantSeed % 2 === 0 ? "16R" : "25";
    const squawk = 4210 + (currentVariantSeed * 17) % 3500;
    const qnh = formatQNH(depCode);
    const distanceNM = calculateDistance(depLoc.lat, depLoc.lon, arrLoc.lat, arrLoc.lon);

    const isFlorence = depCode === "LIRQ" || originInput.toLowerCase().includes("firenze");
    const sidName = isFlorence ? "KUGIX 5A" : `${depCode} 1D`;

    updateMap(depLoc, arrLoc);

    document.getElementById("flightStrip").innerHTML = `
      <div class="strip-item"><span>COMANDANTE</span><strong>Capt. ${captainName}</strong></div>
      <div class="strip-item"><span>VOLO</span><strong>${iataAirline}${flightNum} (${radioCallsign})</strong></div>
      <div class="strip-item"><span>TRATTA</span><strong>${depCode} ➔ ${arrCode} (${distanceNM} NM)</strong></div>
      <div class="strip-item"><span>SID / PISTA</span><strong>${sidName} (RWY ${depRwy})</strong></div>
      <div class="strip-item"><span>SQUAWK</span><strong>${squawk}</strong></div>
    `;

    const phases = [
      {
        title: "1. Imbarco, Clearance & Pushback",
        time: addMinutes(depTime, -15),
        comms: [
          {
            category: "PA", badge: `CAPTAIN ${captainName.toUpperCase()} ➔ PASSEGGERI (PA)`, channel: "CABIN PA",
            en: `"Ladies and gentlemen, this is your captain, ${captainName}, speaking. Welcome aboard ${airlineName} flight ${iataAirline}${flightNum} to ${arrLoc.name}. We are completing our final checks, arrival scheduled at ${arrTime}. Sit back and enjoy the flight."`,
            it: `"Signore e signori, vi parla il comandante ${captainName}. Benvenuti a bordo del volo ${airlineName} ${iataAirline}${flightNum} diretto a ${arrLoc.name}. Completiamo i controlli finali, arrivo previsto alle ${arrTime}. Buon volo."`
          },
          {
            category: "CREW", badge: "COMANDANTE ➔ CABIN CREW", channel: "INTERPHONE",
            en: `"Cabin crew, boarding completed. Doors to automatic, arm the slides and cross-check."`,
            it: `"Equipaggio di cabina, imbarco completato. Porte in automatico, armare gli scivoli e controllo incrociato."`
          },
          {
            category: "PILOT-ATC", badge: `PILOTA (${radioCallsign})`, channel: "VHF DELIVERY",
            en: `"Delivery, ${radioCallsign}, information Bravo, ready for delivery to ${arrLoc.name}."`,
            it: `"Delivery, ${radioCallsign}, informazione Bravo, pronti per l'autorizzazione di rotta per ${arrLoc.name}."`
          },
          {
            category: "ATC", badge: "DELIVERY", channel: "VHF DELIVERY",
            en: `"${radioCallsign}, Delivery, cleared to ${arrLoc.name} via ${sidName} departure, runway ${depRwy}, initial climb 4,000 feet, ${qnh.en}, squawk ${squawk}."`,
            it: `"${radioCallsign}, Delivery, autorizzato a ${arrLoc.name} via partenza ${sidName}, pista ${depRwy}, salita iniziale 4.000 piedi, ${qnh.it}, squawk ${squawk}."`
          },
          {
            category: "PILOT-ATC", badge: `PILOTA (${radioCallsign}) — READBACK`, channel: "VHF DELIVERY",
            en: `"Cleared to ${arrLoc.name} via ${sidName} departure, runway ${depRwy}, initial climb 4,000 feet, ${qnh.en}, squawk ${squawk}, ${radioCallsign}."`,
            it: `"Autorizzato a ${arrLoc.name} via partenza ${sidName}, pista ${depRwy}, salita iniziale 4.000 piedi, ${qnh.it}, squawk ${squawk}, ${radioCallsign}."`
          }
        ]
      },
      {
        title: "2. Rullaggio e Decollo (Takeoff & Readback)",
        time: depTime,
        comms: [
          {
            category: "CREW", badge: "COMANDANTE ➔ CABIN CREW", channel: "CABIN CHIME",
            en: `"Cabin crew, seats for takeoff."`,
            it: `"Equipaggio di cabina, prendere posto per il decollo."`
          },
          {
            category: "PILOT-ATC", badge: `PILOTA (${radioCallsign})`, channel: "VHF TOWER",
            en: `"Tower, ${radioCallsign}, holding short runway ${depRwy}, ready for departure."`,
            it: `"Torre, ${radioCallsign}, al punto attesa pista ${depRwy}, pronti al decollo."`
          },
          {
            category: "ATC", badge: "TOWER", channel: "VHF TOWER",
            en: `"${radioCallsign}, Tower, wind 040 at 10 knots, runway ${depRwy}, cleared for takeoff."`,
            it: `"${radioCallsign}, Torre, vento 040 a 10 nodi, pista ${depRwy}, autorizzato al decollo."`
          },
          {
            category: "PILOT-ATC", badge: `PILOTA (${radioCallsign}) — READBACK`, channel: "VHF TOWER",
            en: `"Cleared for takeoff runway ${depRwy}, ${radioCallsign}."`,
            it: `"Autorizzato al decollo pista ${depRwy}, ${radioCallsign}."`
          }
        ]
      },
      {
        title: "3. Crociera e Inizio Discesa",
        time: addMinutes(arrTime, -25),
        comms: [
          {
            category: "ATC", badge: "CENTER", channel: "VHF RADAR",
            en: `"${radioCallsign}, Center, descend to Flight Level 120, expect ILS approach runway ${arrRwy}."`,
            it: `"${radioCallsign}, Centro, scendete a Livello di Volo 120, aspettatevi avvicinamento ILS pista ${arrRwy}."`
          },
          {
            category: "PILOT-ATC", badge: `PILOTA (${radioCallsign}) — READBACK`, channel: "VHF RADAR",
            en: `"Descend to Flight Level 120, expecting ILS runway ${arrRwy}, ${radioCallsign}."`,
            it: `"Scendiamo a Livello di Volo 120, in attesa dell'ILS pista ${arrRwy}, ${radioCallsign}."`
          },
          {
            category: "PA", badge: "COMANDANTE ➔ PASSEGGERI", channel: "CABIN PA",
            en: `"Ladies and gentlemen, captain speaking. We have begun our descent into ${arrLoc.name}. Weather is fine, temperature 24°C. Please fasten your seatbelts."`,
            it: `"Signore e signori, vi parla il comandante. Abbiamo iniziato la discesa su ${arrLoc.name}. Meteo buono, temperatura 24°C. Vi preghiamo di allacciare le cinture."`
          }
        ]
      },
      {
        title: "4. Avvicinamento e Atterraggio",
        time: arrTime,
        comms: [
          {
            category: "CREW", badge: "COMANDANTE ➔ CABIN CREW", channel: "INTERPHONE",
            en: `"Cabin crew, prepare for landing."`,
            it: `"Equipaggio di cabina, prepararsi all'atterraggio."`
          },
          {
            category: "PILOT-ATC", badge: `PILOTA (${radioCallsign})`, channel: "VHF TOWER",
            en: `"Tower, ${radioCallsign}, established ILS runway ${arrRwy}, four miles out."`,
            it: `"Torre, ${radioCallsign}, stabilizzati sull'ILS pista ${arrRwy}, a quattro miglia."`
          },
          {
            category: "ATC", badge: "TOWER", channel: "VHF TOWER",
            en: `"${radioCallsign}, Tower, wind 110 at 12, runway ${arrRwy}, cleared to land."`,
            it: `"${radioCallsign}, Torre, vento 110 a 12, pista ${arrRwy}, autorizzato all'atterraggio."`
          },
          {
            category: "PILOT-ATC", badge: `PILOTA (${radioCallsign}) — READBACK`, channel: "VHF TOWER",
            en: `"Cleared to land runway ${arrRwy}, ${radioCallsign}."`,
            it: `"Autorizzato all'atterraggio pista ${arrRwy}, ${radioCallsign}."`
          }
        ]
      },
      {
        title: "5. Arrivo al Gate",
        time: addMinutes(arrTime, 8),
        comms: [
          {
            category: "ATC", badge: "TOWER", channel: "VHF TOWER",
            en: `"${radioCallsign}, vacate left via Bravo, contact Ground 121.8. Welcome."`,
            it: `"${radioCallsign}, liberate a sinistra via Bravo, contattate Ground su 121.8. Benvenuti."`
          },
          {
            category: "PA", badge: "COMANDANTE ➔ PASSEGGERI", channel: "CABIN PA",
            en: `"Ladies and gentlemen, welcome to ${arrLoc.name}. Please remain seated until the aircraft is parked at the gate. Thank you for flying with ${airlineName}."`,
            it: `"Signore e signori, benvenuti a ${arrLoc.name}. Siete pregati di rimanere seduti fino al parcheggio al gate. Grazie per aver volato con ${airlineName}."`
          },
          {
            category: "CREW", badge: "COMANDANTE ➔ CABIN CREW", channel: "INTERPHONE",
            en: `"Cabin crew, doors to manual, disarm the slides and cross-check."`,
            it: `"Equipaggio di cabina, porte in manuale, disarmare gli scivoli e controllo incrociato."`
          }
        ]
      }
    ];

    const outputEl = document.getElementById("scriptOutput");
    outputEl.innerHTML = "";

    phases.forEach(phase => {
      const filtered = phase.comms.filter(c => {
        if ((c.category === "ATC" || c.category === "PILOT-ATC") && !document.getElementById("chkATC").checked) return false;
        if (c.category === "CREW" && !document.getElementById("chkCrew").checked) return false;
        if (c.category === "PA" && !document.getElementById("chkPA").checked) return false;
        return true;
      });
      if (filtered.length === 0) return;

      const div = document.createElement("div");
      div.className = "phase-block";
      div.innerHTML = `<div class="phase-header"><span>${phase.title}</span><span class="phase-time">🕒 ${phase.time}</span></div><div class="comm-list">` +
        filtered.map(c => `
          <div class="comm-card type-${c.category.toLowerCase().includes('atc') ? (c.badge.includes('READBACK') ? 'pilot-atc' : 'atc') : c.category.toLowerCase()}">
            <div class="comm-meta"><span class="badge ${c.badge.includes('READBACK') ? 'badge-pilot' : (c.category==='ATC'?'badge-atc':'badge-'+c.category.toLowerCase())}">${c.badge}</span><span class="channel-tag">${c.channel}</span></div>
            <div class="text-en">${c.en}</div>
            ${document.getElementById("chkLangIt").checked ? `<div class="text-it">${c.it}</div>` : ""}
          </div>
        `).join("") + `</div>`;
      outputEl.appendChild(div);
    });

    document.getElementById("glossaryBox").innerHTML = `
      <h3>📖 Note di Fraseologia Reale</h3>
      <div class="glossary-grid">
        <div class="glossary-item"><strong>Readback Obbligatorio:</strong> <span>Il pilota ripete integralmente ogni autorizzazione critica (quota, pista, squawk, SID) per sicurezza e conformità alle norme ICAO.</span></div>
        <div class="glossary-item"><strong>SID (${sidName}):</strong> <span>Procedura di salita iniziale pubblicata per il rispetto dei sorvoli e dei rilievi.</span></div>
      </div>
    `;
  }

  window.onload = () => generateScript(false);
</script>

</body>
</html>
